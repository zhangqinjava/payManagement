spring:
  datasource:
    url: jdbc:mysql://localhost:3306/account?autoReconnect=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true
    password: zq199613
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
    gateway:
      routes:
        - id: merchant-route
          uri: lb://merchant-module
          predicates:
            - Path=/merchant/**
        - id: order-route
          uri: lb://order-module
          predicates:
            - Path=/order/**
        - id: account-route
          uri: lb://account-module
          predicates:
            - Path=/account/**
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8080
        port: 8719
      datasource:
        ds1:
          nacos:
            server-addr: localhost:8848
            data-id: ${spring.application.name}-sentinel-gateway
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
  redis:
    host: localhost
    port: 6379
    database: 0
    connect-timeout: 5000ms
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 8
        # 最大等待阻塞时间
        max-wait: -1ms
        # 最大空闲连接
        max-idle: 8
        # 最小空闲连接
        min-idle: 0
